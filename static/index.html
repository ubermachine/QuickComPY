<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickCom Search</title>
    <meta name="theme-color" content="#0f172a">
    <!-- Inline, so the browser's automatic /favicon.ico request never happens. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>%E2%9A%A1</text></svg>">
    <!-- The stylesheet is render-blocking and the font files live on a second
         origin, so open both connections now rather than after the CSS parses. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            /* A real fallback stack: text paints immediately on the system
               font instead of waiting out the webfont round trip. */
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            background-attachment: fixed;
            color: #f8fafc;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 { text-align: center; margin-bottom: 2rem; font-weight: 800; font-size: 2.5rem; }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Location Section */
        .section-title { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #e2e8f0; }
        .presets-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 1rem; }
        .preset-btn {
            background: rgba(255,255,255,0.1); color: #f8fafc; border: 1px solid rgba(255,255,255,0.2);
            padding: 0.75rem; border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; transition: all 0.2s;
        }
        .preset-btn:hover:not(:disabled) { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); }
        .preset-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .input-row { display: flex; gap: 1rem; margin-bottom: 1rem; align-items: flex-end; }
        .input-group { flex: 3; display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { color: #f8fafc; font-size: 0.9rem; font-weight: 600; }
        input[type="text"] {
            background: rgba(255,255,255,0.12); color: #f8fafc; border: 1px solid rgba(255,255,255,0.25);
            padding: 0.75rem; border-radius: 8px; font-family: inherit; font-size: 1rem; outline: none; width: 100%;
        }
        select {
            background: rgba(255,255,255,0.12); color: #f8fafc; border: 1px solid rgba(255,255,255,0.25);
            padding: 0.75rem; border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none;
            width: 100%; cursor: pointer;
        }
        select:focus { border-color: #3b82f6; }
        select:disabled { opacity: 0.5; cursor: not-allowed; }
        select option { background: #1e293b; color: #f8fafc; }
        .filter-group { flex: 1; display: flex; flex-direction: column; gap: 0.5rem; min-width: 150px; }
        .filter-group label { color: #cbd5e1; font-size: 0.8rem; font-weight: 600; }
        .filter-note { color: #94a3b8; font-size: 0.85em; margin-top: -0.5rem; margin-bottom: 1rem; min-height: 1.2em; }
        .discount-pct { color: #34d399; font-weight: 700; font-size: 0.8em; }
        input[type="text"]::placeholder { color: #94a3b8; }
        input[type="text"]:focus { border-color: #3b82f6; }
        input[type="text"]:disabled { opacity: 0.5; cursor: not-allowed; }

        .primary-btn {
            flex: 1; background: #3b82f6; color: white; border: none; padding: 0.75rem;
            border-radius: 8px; cursor: pointer; font-family: inherit; font-weight: 600; font-size: 1rem; transition: background 0.2s; height: 46px;
        }
        .primary-btn:hover:not(:disabled) { background: #2563eb; }
        .primary-btn:disabled { background: #1e3a8a; color: #94a3b8; cursor: not-allowed; }

        /* Status Badges */
        #status-container { margin-bottom: 2rem; display: none; }
        .success-box { background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); padding: 1rem; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; }
        .badges { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
        .badge-ok { background: rgba(16, 185, 129, 0.2); color: #34d399; padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .badge-err { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 4px 10px; border-radius: 20px; font-size: 0.85em; font-weight: 600; }
        .change-loc-btn { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-family: inherit; }
        .change-loc-btn:hover { background: rgba(255,255,255,0.2); }

        hr { border: none; border-top: 1px solid rgba(255,255,255,0.1); margin: 2rem 0; }

        /* Loading Overlay */
        #loading-overlay { display: none; margin-top: 2rem; text-align: center; color: #94a3b8; font-weight: 600; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); border-left-color: #3b82f6; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 1rem auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Grid Layout */
        #results-container { display: grid; grid-template-columns: repeat(var(--vendor-cols, 5), 1fr); gap: 1.5rem; margin-top: 2rem; display: none; }
        .vendor-col { display: flex; flex-direction: column; gap: 1rem; }
        .vendor-header { text-align: center; margin-bottom: 1rem; }

        .brand-badge { padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 1em; display: inline-block; color: white; text-transform: uppercase; letter-spacing: 1px; }
        .bg-blinkit { background: linear-gradient(90deg, #f59e0b, #d97706); }
        .bg-bigbasket { background: linear-gradient(90deg, #84cc16, #65a30d); }
        .bg-jiomart { background: linear-gradient(90deg, #3b82f6, #2563eb); }
        .bg-zepto { background: linear-gradient(90deg, #8b5cf6, #6d28d9); }
        .bg-instamart { background: linear-gradient(90deg, #f97316, #ea580c); }
        .bg-amazon { background: linear-gradient(90deg, #ff9900, #e47911); }
        .vendor-count { color: #94a3b8; font-size: 0.85em; margin-top: 0.25rem; }

        /* Cards.
           No backdrop-filter: the only thing behind a card is the body's own
           static gradient, so blurring it produces something the eye cannot
           tell from a flat translucent fill -- while forcing a separate
           compositing layer and a backdrop sample for every one of ~48 cards.
           A slightly more opaque fill buys the same look for nothing.
           content-visibility lets the browser skip layout and paint for the
           cards scrolled off the bottom, which on six columns is most of them. */
        .glass-card {
            background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; padding: 16px; transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column; height: 100%;
            content-visibility: auto; contain-intrinsic-size: auto 300px;
        }
        .glass-card:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.3); border-color: rgba(255, 255, 255, 0.2); }
        .product-img { width: 100%; height: 140px; object-fit: contain; border-radius: 8px; margin-bottom: 12px; background: rgba(255,255,255,0.9); padding: 8px; }
        .product-title { font-weight: 600; font-size: 1.05em; line-height: 1.3; margin-bottom: 8px; color: #f8fafc; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .product-meta { color: #cbd5e1; font-size: 0.8em; margin-bottom: 8px; }
        .price-row { display: flex; align-items: center; gap: 8px; margin-top: auto; }
        .current-price { font-size: 1.25em; font-weight: 800; color: #34d399; }
        .original-price { text-decoration: line-through; color: #64748b; font-size: 0.9em; }
        .discount-badge { background: rgba(239, 68, 68, 0.2); color: #f87171; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; font-weight: 600; display: inline-block; margin-top: 4px; }
        .status-note { text-align: center; font-size: 0.85em; padding: 1.25rem 0.75rem; border-radius: 8px; line-height: 1.4; }
        .status-blocked { color: #fca5a5; background: rgba(239, 68, 68, 0.08); border: 1px dashed rgba(248, 113, 113, 0.4); }
        .status-timeout { color: #fcd34d; background: rgba(245, 158, 11, 0.08); border: 1px dashed rgba(252, 211, 77, 0.4); }
        .status-error   { color: #fca5a5; background: rgba(239, 68, 68, 0.08); border: 1px dashed rgba(248, 113, 113, 0.4); }
        .status-icon { display: block; font-size: 1.5em; margin-bottom: 0.4rem; }
        .vendor-count.warn { color: #fcd34d; }
        .empty-state { text-align: center; color: #94a3b8; font-style: italic; padding: 2rem; background: rgba(255,255,255,0.02); border-radius: 8px; border: 1px dashed rgba(255,255,255,0.1); }

        /* A column still being scraped. Results stream in one platform at a
           time, so the grid is up and filling long before the slowest lands. */
        .skeleton { border-radius: 12px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06); height: 300px; animation: pulse 1.4s ease-in-out infinite; }
        .skeleton + .skeleton { height: 300px; }
        @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 0.85; } }
        .vendor-count.pending { color: #93c5fd; }

        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
            .skeleton { animation: none; }
            .glass-card, .primary-btn, .preset-btn { transition: none; }
        }

        @media (max-width: 1024px) {
            #results-container { grid-template-columns: repeat(2, 1fr); }
            .presets-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            #results-container { grid-template-columns: 1fr; }
            .input-row { flex-direction: column; align-items: stretch; }
            .primary-btn { flex: none; width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ QuickCom Search</h1>

        <div id="location-section">
            <h3 class="section-title">📍 Select Delivery Location</h3>
            <div class="presets-grid">
                <button class="preset-btn" onclick="setPincode('201306')">Noida (201306)</button>
                <button class="preset-btn" onclick="setPincode('400001')">Mumbai (400001)</button>
                <button class="preset-btn" onclick="setPincode('110001')">Delhi (110001)</button>
                <button class="preset-btn" onclick="setPincode('560001')">Bangalore (560001)</button>
            </div>

            <div class="input-row">
                <div class="input-group">
                    <label>Pincode</label>
                    <input type="text" id="pincode-input" value="201306">
                </div>
                <button class="primary-btn" id="set-loc-btn" onclick="submitLocation()">Set Location</button>
            </div>
        </div>

        <div id="status-container">
            <div class="success-box">
                <div>
                    <div>Success! Vendors initialized for location: <strong id="current-loc-text"></strong></div>
                    <div class="badges" id="vendor-badges"></div>
                </div>
                <button class="change-loc-btn" onclick="resetLocation()">Change</button>
            </div>
        </div>

        <hr>

        <div id="search-section">
            <h3 class="section-title">🔍 Search Products</h3>
            <div class="input-row">
                <div class="input-group">
                    <input type="text" id="search-input" placeholder="e.g. Milk, Bread, Eggs..." disabled>
                </div>
                <div class="filter-group">
                    <label for="sort-select">Sort by</label>
                    <select id="sort-select" onchange="onViewChange()" disabled>
                        <option value="relevance" selected>Best match</option>
                        <option value="discount">Biggest discount</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="discount-select">Min discount</label>
                    <select id="discount-select" onchange="onViewChange()" disabled>
                        <option value="0" selected>Any</option>
                        <option value="10">10% or more</option>
                        <option value="20">20% or more</option>
                        <option value="30">30% or more</option>
                        <option value="50">50% or more</option>
                    </select>
                </div>
                <button class="primary-btn" id="search-btn" onclick="submitSearch()" disabled>Search All Apps</button>
            </div>
            <div class="filter-note" id="filter-note"></div>
        </div>

        <div id="loading-overlay">
            <div class="spinner"></div>
            <div id="loading-text">Initializing...</div>
        </div>

        <div id="results-container">
            <!-- Columns will be injected here -->
        </div>
    </div>

    <script>
        // Populated from /api/services so the backend registry stays the single
        // source of truth; these are only a fallback if that call fails.
        let SERVICES = ["blinkit", "instamart", "bigbasket", "jiomart", "zepto"];
        let DISPLAY_NAMES = { blinkit: "Blinkit", instamart: "Swiggy Instamart", bigbasket: "BigBasket", jiomart: "JioMart", zepto: "Zepto" };
        let BRAND_COLORS = {};
        let MAX_PRODUCTS = 8;
        let isLocationSet = false;

        const $ = id => document.getElementById(id);

        const servicesReady = (async function loadServices() {
            try {
                const res = await fetch('/api/services');
                if(!res.ok) return;
                const data = await res.json();
                if(!data.services || !data.services.length) return;
                SERVICES = data.services.map(s => s.key);
                DISPLAY_NAMES = {};
                BRAND_COLORS = {};
                for(const s of data.services) {
                    DISPLAY_NAMES[s.key] = s.label;
                    BRAND_COLORS[s.key] = `linear-gradient(90deg, ${s.colorFrom}, ${s.colorTo})`;
                }
                if(data.maxProducts) MAX_PRODUCTS = data.maxProducts;
                // A custom property, not an inline grid-template-columns: an
                // inline value would override the responsive media queries.
                $('results-container').style.setProperty('--vendor-cols', SERVICES.length);
            } catch (e) {
                // Fall back to the hardcoded list above.
            }
        })();

        function setPincode(code) {
            if(!isLocationSet) $('pincode-input').value = code;
        }

        function setInputsDisabled(locDisabled, searchDisabled) {
            $('pincode-input').disabled = locDisabled;
            document.querySelectorAll('.preset-btn').forEach(btn => btn.disabled = locDisabled);
            $('set-loc-btn').disabled = locDisabled;

            $('search-input').disabled = searchDisabled;
            $('search-btn').disabled = searchDisabled;
            // Sort and filter are answered from data already in the page, so
            // they stay live even while a fresh search is still streaming in.
            $('sort-select').disabled = searchDisabled && !hasResults();
            $('discount-select').disabled = searchDisabled && !hasResults();
        }

        async function submitLocation() {
            const loc = $('pincode-input').value;
            if(!loc) return;

            setInputsDisabled(true, true);
            $('loading-overlay').style.display = 'block';
            $('loading-text').innerText = 'Initializing vendor sessions... This may take up to 15 seconds.';
            $('results-container').style.display = 'none';

            try {
                const res = await fetch('/api/set-location', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ location: loc })
                });
                const data = await res.json();

                $('current-loc-text').innerText = loc;
                // One assignment: `innerHTML +=` in a loop reparses everything
                // already there on each pass.
                $('vendor-badges').innerHTML = SERVICES.map(svc => {
                    const name = escapeHTML(DISPLAY_NAMES[svc] || svc);
                    return data[svc]
                        ? `<span class="badge-ok">[OK] ${name}</span>`
                        : `<span class="badge-err">[ERR] ${name} Failed</span>`;
                }).join('');

                $('location-section').style.display = 'none';
                $('status-container').style.display = 'block';
                isLocationSet = true;
                setInputsDisabled(true, false);
            } catch (e) {
                alert('Error setting location');
                setInputsDisabled(false, true);
            } finally {
                $('loading-overlay').style.display = 'none';
            }
        }

        function resetLocation() {
            isLocationSet = false;
            POOLS = {};
            searchDone = true;
            $('location-section').style.display = 'block';
            $('status-container').style.display = 'none';
            $('results-container').style.display = 'none';
            setInputsDisabled(false, true);
            $('search-input').value = '';
        }

        function currentView() {
            return {
                sort: $('sort-select').value,
                minDiscount: parseInt($('discount-select').value, 10) || 0
            };
        }

        // ------------------------------------------------------------------
        // Results state
        //
        // The API sends every ranked candidate it found (`pool`) alongside the
        // page of them it would show. Keeping the pool here is what makes sort
        // and filter instant: they are a re-render of data already in the page,
        // not another request.
        // ------------------------------------------------------------------
        let POOLS = {};          // svc -> { pool, status, message }
        let searchSeq = 0;       // guards against a stale stream finishing late
        let activeStream = null;
        // Whether the current search has stopped producing columns. A column
        // with no entry is still being scraped until this is set; after it, the
        // platform is one we never heard back from, and saying so beats leaving
        // a placeholder pulsing forever.
        let searchDone = true;

        function hasResults() {
            return Object.keys(POOLS).length > 0;
        }

        // Mirrors common.apply_view on the server: filter, then a stable sort
        // so equally-discounted items keep their relevance order.
        function applyView(pool, sort, minDiscount) {
            let list = pool || [];
            if(minDiscount > 0) list = list.filter(p => (p.discountPercent || 0) >= minDiscount);
            if(sort === 'discount') {
                list = list.slice().sort((a, b) => (b.discountPercent || 0) - (a.discountPercent || 0));
            }
            return list;
        }

        function onViewChange() {
            if(!hasResults()) return;
            renderAll();
        }

        function stopStream() {
            if(activeStream) { activeStream.close(); activeStream = null; }
        }

        async function submitSearch() {
            const query = $('search-input').value;
            if(!query) return;
            await servicesReady;

            const seq = ++searchSeq;
            stopStream();
            POOLS = {};
            searchDone = false;

            setInputsDisabled(true, true);
            $('loading-overlay').style.display = 'block';
            $('loading-text').innerText = `Searching for '${query}' across all vendors...`;
            $('filter-note').innerText = '';
            renderAll();                                  // skeletons, immediately
            $('results-container').style.display = 'grid';

            const { sort, minDiscount } = currentView();
            const params = new URLSearchParams({ q: query, sort: sort, min_discount: minDiscount });

            const finish = () => {
                if(seq !== searchSeq) return;
                searchDone = true;
                stopStream();
                $('loading-overlay').style.display = 'none';
                setInputsDisabled(true, false);
                renderAll();
            };

            // Stream the columns in. A search is only ever as fast as its
            // slowest platform; this way the user waits for the slowest *column*
            // instead of for all six.
            if(typeof EventSource !== 'undefined') {
                let sawResult = false;
                const es = new EventSource(`/api/search/stream?${params}`);
                activeStream = es;

                es.addEventListener('result', ev => {
                    if(seq !== searchSeq) return;
                    sawResult = true;
                    try {
                        const d = JSON.parse(ev.data);
                        POOLS[d.service] = { pool: d.pool || d.products || [], status: d.status, message: d.message };
                        renderColumn(d.service);
                        describeView();
                        $('loading-text').innerText =
                            `Searching... ${Object.keys(POOLS).length} of ${SERVICES.length} vendors in`;
                    } catch (e) { /* a malformed frame must not kill the stream */ }
                });
                es.addEventListener('done', () => finish());
                es.onerror = () => {
                    if(seq !== searchSeq) return;
                    // EventSource retries by itself; if it died before a single
                    // column arrived, fall back to the one-shot endpoint.
                    stopStream();
                    if(sawResult) finish();
                    else fetchAll(seq, params, finish);
                };
                return;
            }

            fetchAll(seq, params, finish);
        }

        async function fetchAll(seq, params, finish) {
            try {
                const res = await fetch(`/api/search?${params}`);
                const data = await res.json();
                if(seq !== searchSeq) return;
                for(const svc of SERVICES) {
                    const raw = data[svc];
                    if(!raw) continue;
                    const r = Array.isArray(raw) ? { products: raw, status: raw.length ? 'ok' : 'empty' } : raw;
                    POOLS[svc] = { pool: r.pool || r.products || [], status: r.status, message: r.message };
                }
            } catch (e) {
                if(seq === searchSeq) alert('Error performing search');
            } finally {
                finish();
            }
        }

        $('search-input').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') submitSearch();
        });

        function escapeHTML(str) {
            if(!str) return '';
            return str.toString().replace(/[&<>'"]/g,
                tag => ({
                    '&': '&amp;',
                    '<': '&lt;',
                    '>': '&gt;',
                    "'": '&#39;',
                    '"': '&quot;'
                }[tag] || tag)
            );
        }

        const STATUS_LABEL = {
            ok: 'No items', empty: 'No matches',
            blocked: 'Blocked', timeout: 'Timed out', error: 'Failed'
        };

        // An empty column has very different meanings -- the store genuinely has
        // nothing, or it served us a bot challenge. Say which.
        const STATUS_DETAIL = {
            blocked: ['&#128683;', name => `${name} blocked the request (bot protection). Try again in a moment.`, 'status-blocked'],
            timeout: ['&#9203;', name => `${name} did not respond in time.`, 'status-timeout'],
            error:   ['&#9888;', name => `Could not reach ${name}.`, 'status-error'],
        };

        function statusNoteHTML(svc, status) {
            const detail = STATUS_DETAIL[status];
            if(!detail) return `<div class="empty-state">No products found</div>`;
            const [icon, text, cls] = detail;
            return `<div class="status-note ${cls}"><span class="status-icon">${icon}</span>${escapeHTML(text(DISPLAY_NAMES[svc] || svc))}</div>`;
        }

        function cardHTML(p) {
            const img = escapeHTML(p.imageUrl || '');
            // loading/decoding keep a grid of ~48 thumbnails off the critical
            // path; a dead CDN URL removes its own broken-image box.
            const imgTag = img
                ? `<img src="${img}" class="product-img" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.remove()">`
                : '';
            const orig = escapeHTML(p.originalPrice || '');
            const badge = p.discount || (p.discountPercent > 0 ? `${Math.round(p.discountPercent)}% OFF` : '');
            return `<div class="glass-card">`
                + imgTag
                + `<div class="product-title">${escapeHTML(p.name || 'Unknown')}</div>`
                + `<div class="product-meta">${escapeHTML(p.quantity || '1 item')} | Time: ${escapeHTML(p.deliveryTime || 'N/A')}</div>`
                + `<div class="price-row"><span class="current-price">${escapeHTML(p.price || 'N/A')}</span>`
                + (orig ? `<span class="original-price">${orig}</span>` : '')
                + `</div>`
                + (badge ? `<div><span class="discount-badge">${escapeHTML(badge)}</span></div>` : '')
                + `</div>`;
        }

        // One innerHTML assignment per column rather than an appendChild per
        // card: ~48 separate insertions is ~48 chances to invalidate layout.
        function columnHTML(svc) {
            const entry = POOLS[svc];
            const brand = BRAND_COLORS[svc]
                ? `<div class="brand-badge" style="background:${BRAND_COLORS[svc]}">${escapeHTML(DISPLAY_NAMES[svc] || svc)}</div>`
                : `<div class="brand-badge bg-${escapeHTML(svc)}">${escapeHTML(DISPLAY_NAMES[svc] || svc)}</div>`;

            if(!entry) {
                if(!searchDone) {
                    return `<div class="vendor-header">${brand}<div class="vendor-count pending">Searching…</div></div>`
                         + `<div class="skeleton"></div><div class="skeleton"></div>`;
                }
                // The search ended without this platform ever reporting -- the
                // stream dropped, or the request failed part way through.
                return `<div class="vendor-header">${brand}`
                     + `<div class="vendor-count warn">${STATUS_LABEL.error}</div></div>`
                     + statusNoteHTML(svc, 'error');
            }

            const { sort, minDiscount } = currentView();
            const matched = applyView(entry.pool, sort, minDiscount);
            const view = matched.slice(0, MAX_PRODUCTS);

            // Mirrors the server: a filter that excludes everything is not the
            // platform failing.
            let status = entry.status;
            if(view.length === 0 && (entry.pool || []).length) status = 'empty';

            const count = view.length
                ? `<div class="vendor-count">Found ${view.length} items</div>`
                : `<div class="vendor-count warn">${STATUS_LABEL[status] || 'Unavailable'}</div>`;

            const body = view.length ? view.map(cardHTML).join('') : statusNoteHTML(svc, status);
            return `<div class="vendor-header">${brand}${count}</div>${body}`;
        }

        function renderColumn(svc) {
            let col = document.getElementById(`col-${svc}`);
            if(!col) { renderAll(); return; }
            col.innerHTML = columnHTML(svc);
        }

        function renderAll() {
            const container = $('results-container');
            // Build off-document, attach once: one reflow for the whole grid.
            const frag = document.createDocumentFragment();
            for(const svc of SERVICES) {
                const col = document.createElement('div');
                col.className = 'vendor-col';
                col.id = `col-${svc}`;
                col.innerHTML = columnHTML(svc);
                frag.appendChild(col);
            }
            container.replaceChildren(frag);
            describeView();
        }

        function describeView() {
            const { sort, minDiscount } = currentView();
            let shown = 0, matched = 0;
            for(const svc of SERVICES) {
                const entry = POOLS[svc];
                if(!entry) continue;
                const m = applyView(entry.pool, sort, minDiscount);
                matched += m.length;
                shown += Math.min(m.length, MAX_PRODUCTS);
            }
            const bits = [];
            if(minDiscount > 0) bits.push(`filtered to ${minDiscount}%+ off`);
            if(sort === 'discount') bits.push('sorted by biggest discount');
            if(matched > shown) bits.push(`showing top ${shown} of ${matched} matches`);
            $('filter-note').innerText = bits.length ? bits.join(' · ') : '';
        }
    </script>
</body>
</html>
